# Pengaturan bot. Ubah angka di sini lalu restart bot; kode tidak perlu disentuh.
# Rahasia (token bot Telegram, ID, login MT5) TIDAK di sini, tapi di file .env.

akun:
  hanya_demo: true            # bot menolak jalan kalau MT5 login ke akun real

risiko:
  mode: persen                # persen = % dari saldo | dolar = nominal tetap per setup
  persen: 1.0                 # dipakai kalau mode: persen
  dolar: 10                   # dipakai kalau mode: dolar (dalam mata uang akun)
  lot_maks: 5.0               # batas atas total lot satu setup
  # Risiko dihitung TOTAL untuk semua kaki TP: kalau semua kena SL, rugi = angka di atas.
  # Satu setup bisa menimpa ini dengan baris "Risk: 0.5%" atau "Risk: $20".

tp:
  # Pembagian lot (%) per TP, menurut jumlah TP di setup.
  # Kalau lot terlalu kecil untuk dibagi, TP paling jauh dibuang.
  bagi:
    1: [100]
    2: [50, 50]
    3: [50, 30, 20]
    4: [40, 30, 20, 10]
    5: [30, 25, 20, 15, 10]

sop:
  be_setelah_tp: 1            # SL digeser ke BE setelah TP ke-berapa kena (0 = mati)
  be_jarak_aman_r: 0.1        # BE dikunci sedikit di atas entry: 0.1 = 10% dari jarak entry-SL
  trailing: true              # bertingkat: TP2 kena -> SL ke TP1, TP3 kena -> SL ke TP2, dst.
  tutup_jika_sl_baru_terlewat: true   # harga balik melewati SL baru sebelum sempat digeser -> tutup

entry:
  limit_kedaluwarsa_jam: 12   # limit yang belum ke-fill dibatalkan setelah ini
  jika_harga_sudah_lewat: market   # LIMIT tapi harga sudah lebih bagus dari entry: market | tolak

gerbang:
  umur_maks_setup_menit: 30           # postingan lebih tua dari ini ditolak (basi)
  jarak_maks_dari_harga_persen: 1.0   # entry lebih jauh dari ini (dari harga sekarang) ditolak
  konfirmasi_wajib: true              # tanya Ya/Tidak di Telegram sebelum eksekusi
  konfirmasi_kedaluwarsa_menit: 30    # tidak dijawab -> batal
  dobel_jendela_jam: 24               # setup sama persis dalam jendela ini ditolak sebagai dobel
  mirip_jarak_entry_persen: 0.15      # pair & arah sama, entry sedekat ini -> diberi tanda "mirip"

pengaman:
  maks_setup_aktif: 3         # setup yang sedang jalan/menunggu fill
  loss_harian_persen: 3.0     # stop terima setup baru kalau loss hari ini sampai segini
  loss_harian_dolar: null     # isi angka kalau mau batas nominal juga (yang kena duluan berlaku)

simbol:                       # nama di setup -> nama di MT5 Exness (cek di Market Watch)
  XAUUSD: XAUUSDm
  GOLD: XAUUSDm
  EURUSD: EURUSDm
  GBPUSD: GBPUSDm
  USDJPY: USDJPYm
  BTCUSD: BTCUSDm

mt5:
  magic: 260101               # penanda order milik bot
  deviasi_poin: 20            # toleransi slippage order market

bot:
  interval_detik: 2           # seberapa sering posisi dicek
  jurnal: data/jurnal.db

pembaca:                      # program kedua: channel sinyal -> channel kotak masuk
  channel_sumber: "-1002631236672"   # ID channel sinyal (cari dengan "Cari Channel Sumber.bat")
  topik_sumber: 78395         # grup bertopik: nomor topik sinyal (lihat "Cari Channel Sumber.bat"); null = semua
  nama_sumber: outlook        # nama yang ditulis di baris "Sumber:" dan di jurnal
  claude_model: sonnet        # model Claude untuk membaca gambar (sonnet / opus / haiku)
  simbol_dari_harga:          # gambar tanpa nama simbol: ditebak dari besar harganya
    - {simbol: XAUUSD, min: 1000, max: 10000, alias: [GOLD, XAU]}
    - {simbol: BTCUSD, min: 10000, max: 1000000, alias: [BTC, BTCUSDT]}
  # Pesan teks dari channel diteruskan sebagai info. Kata-kata di bawah membuat bot
  # menawarkan tombol (batalkan limit / tutup posisi). Bot tidak bertindak sendiri.
  kata_cancel: [cancel, canceled, cancelled, batal, dibatalkan]
  kata_close: [close, close now, tutup, exit, cut]
  kata_highrisk: [high risk, highrisk, hi risk, risiko tinggi, resiko tinggi]
